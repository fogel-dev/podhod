services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: podhod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      - db_api_password
      - db_worker_password
      - db_migration_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./apps/api/db/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d podhod']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ['/migrate']
    environment:
      DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets:
      - migration_database_url
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL_FILE: /run/secrets/api_database_url
      AUTH_HMAC_KEY_FILE: /run/secrets/auth_hmac_key
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      AUTH_INSECURE_LOCAL: '1'
    secrets:
      - api_database_url
      - auth_hmac_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - '8080'
    restart: unless-stopped
    stop_grace_period: 15s
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ['/worker']
    environment:
      DATABASE_URL_FILE: /run/secrets/worker_database_url
      JOB_ENCRYPTION_KEY_FILE: /run/secrets/job_encryption_key
    secrets:
      - worker_database_url
      - job_encryption_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data:
secrets:
  db_admin_password:
    file: ${PODHOD_SECRETS_DIR:?Set PODHOD_SECRETS_DIR}/db_admin_password
  db_api_password:
    file: ${PODHOD_SECRETS_DIR}/db_api_password
  db_worker_password:
    file: ${PODHOD_SECRETS_DIR}/db_worker_password
  db_migration_password:
    file: ${PODHOD_SECRETS_DIR}/db_migration_password
  api_database_url:
    file: ${PODHOD_SECRETS_DIR}/api_database_url
  migration_database_url:
    file: ${PODHOD_SECRETS_DIR}/migration_database_url
  worker_database_url:
    file: ${PODHOD_SECRETS_DIR}/worker_database_url
  job_encryption_key:
    file: ${PODHOD_SECRETS_DIR}/job_encryption_key
  auth_hmac_key:
    file: ${PODHOD_SECRETS_DIR}/auth_hmac_key
