services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HTTP_ADDR: 0.0.0.0:8080
    expose:
      - '8080'
    restart: unless-stopped
    stop_grace_period: 15s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - api
    restart: unless-stopped
