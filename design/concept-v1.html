<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подход · дизайн-концепция</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--surface:#fff;--text:#1c1c1e;--muted:#66666d;--line:#e7e7eb;--accent:#235bd6;--soft:#edf2ff;--shadow:0 6px 28px #191b2510}
:root.dark{color-scheme:dark;--bg:#111113;--surface:#1d1d20;--text:#f5f5f7;--muted:#a5a5ae;--line:#333338;--accent:#8aaaff;--soft:#252e44;--shadow:0 6px 28px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}body,button,input,textarea,.surface{transition:background-color .3s,color .3s}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none;min-height:44px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}p,h1,h2,h3{margin:0}h1{font-size:34px;letter-spacing:-1.2px;line-height:1.12}h2{font-size:23px;letter-spacing:-.65px}h3{font-size:18px;letter-spacing:-.25px}.muted{color:var(--muted)}.small{font-size:13px}.app{max-width:460px;margin:auto;padding:18px 22px calc(106px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{font-size:18px;font-weight:650;letter-spacing:-.5px}.theme{background:var(--surface);border-radius:50%;width:44px;box-shadow:var(--shadow);font-size:20px}.eyebrow{font-size:14px;color:var(--muted);margin-bottom:8px}header{margin-bottom:28px}.surface{background:var(--surface);border-radius:24px;padding:23px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.section{margin-top:28px}.primary{display:block;width:100%;background:var(--accent);color:var(--surface);border-radius:16px;padding:14px 18px;font-weight:600;min-height:52px}.dark .primary{color:#101522}.secondary{color:var(--accent);padding:10px 0}.lead{font-size:27px;font-weight:650;letter-spacing:-.8px;margin:8px 0}.meta{display:flex;gap:18px;margin:8px 0 22px;font-size:14px;color:var(--muted)}.monthhead{margin:0 0 14px}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px}.day{position:relative;min-height:62px;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:12px;overflow:visible}.day .num{display:grid;place-items:center;width:29px;height:29px;font-size:15px}.day.today .num{background:var(--accent);color:var(--surface);border-radius:50%}.dark .day.today .num{color:#101522}.day[aria-pressed=true]{background:var(--soft)}.dot{height:5px;width:5px;border-radius:50%;background:var(--accent)}.past .dot{background:var(--muted)}.photo{font-size:9px;letter-spacing:.3px;line-height:17px;background:var(--line);color:var(--muted);width:25px;height:19px;border-radius:4px;box-shadow:3px 2px 0 var(--surface),4px 3px 0 var(--line);transform:rotate(-6deg)}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}.next{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);z-index:3}.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}.nav button[aria-selected=true]{color:var(--accent)}.nav svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.exercise{padding:19px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.exercise .name{text-align:left;padding:0;font-size:18px;font-weight:600;min-height:30px}.sets{display:flex;gap:9px;margin-top:14px}.set{width:45px;height:44px;border-radius:50%;background:var(--surface);font-size:15px;box-shadow:var(--shadow)}.set[aria-pressed=true]{background:var(--accent);color:var(--surface)}.dark .set[aria-pressed=true]{color:#101522}.rest{margin-top:20px;background:var(--soft);padding:20px;border-radius:20px}.timer{font-size:36px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}.rest .primary{margin-top:12px}.segment{display:flex;background:var(--line);padding:3px;border-radius:11px;margin:18px 0;gap:3px}.segment button{flex:1;border-radius:8px;min-height:36px;font-size:14px}.segment .active{background:var(--surface);box-shadow:var(--shadow)}.big{font-size:42px;letter-spacing:-1.8px;font-weight:650;line-height:1.1}.metric{margin:26px 0}.chart{width:100%;height:auto;overflow:visible}.chart text{fill:var(--muted);font-size:12px}.chart .gridline{stroke:var(--line)}.chart .trend{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.chart circle{fill:var(--accent)}.daypick{display:flex;justify-content:space-between;margin:16px 0}.daypick button{border-radius:50%;width:40px;background:var(--surface);font-size:14px}.daypick button[aria-pressed=true]{background:var(--accent);color:var(--surface)}.dark .daypick button[aria-pressed=true]{color:#101522}.field{display:block;margin:14px 0;font-size:14px;color:var(--muted)}input,textarea{width:100%;display:block;border:0;border-radius:12px;background:var(--surface);color:var(--text);padding:14px;margin-top:7px;min-width:0;font-size:16px}textarea{resize:vertical;min-height:100px}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{margin-top:22px;font-size:12px;color:var(--muted)}.back{padding:0;color:var(--accent);margin-bottom:12px}.toast{margin-top:14px;font-size:14px;color:var(--accent)}.summary{margin:22px 0;display:flex;gap:28px}.summary strong{display:block;font-size:24px}.sheet{margin-top:20px}.tile{background:var(--line);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;font-size:13px;color:var(--muted)}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media(min-width:700px){.app{padding-top:30px}.nav{border-radius:22px 22px 0 0}}@media(max-width:350px){.app{padding-left:14px;padding-right:14px}.surface{padding:18px}.dates{grid-template-columns:1fr}.day{min-height:58px}.meta{gap:12px}.set{width:44px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<div class="top"><span class="brand">подход.</span><button class="theme" id="theme" aria-label="Включить тёмную тему">☾</button></div>
<div id="screen"></div><p class="notice">Дизайн-эскиз · демонстрационные данные<br>Изменения действуют только до перезагрузки.</p>
</main>
<nav class="nav" aria-label="Разделы приложения">
<button data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2m3 6V7m10 10V7m3 6v-2M7 12h10"/></svg>Сегодня</button>
<button data-tab="calendar" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18"/></svg>Календарь</button>
<button data-tab="program" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6m-6 4h6m-6 4h3"/></svg>Программа</button>
<button data-tab="progress" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v17h17M7 15l5-5 4 2 5-7"/></svg>Прогресс</button>
</nav>
<script>
const screen=document.getElementById('screen');
let tab='today',selectedDay=10,month=9,year=2026,active=false,restStart=null,completed=[0,0,0],restLog=[],done=false;
const names=['Жим лёжа','Тяга верхнего блока','Жим гантелей'],weights=[80,55,22],targets=[4,3,3];
const weekdays=new Set([1,3,5]);
function calendar(){const count=new Date(year,month+1,0).getDate(),offset=(new Date(year,month,1).getDay()+6)%7;let html='<div class="row monthhead"><h2>'+new Date(year,month).toLocaleDateString('ru',{month:'long',year:'numeric'}).replace(' г.','')+'</h2><div><button data-month="-1" aria-label="Предыдущий месяц">‹</button><button data-month="1" aria-label="Следующий месяц">›</button></div></div><div class="week">'+['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="grid">';for(let i=0;i<offset;i++)html+='<span></span>';for(let d=1;d<=count;d++){const sample=year===2026&&month===9,train=sample&&[2,5,7,9,12,14,16,19,21,23,26,28,30].includes(d),photo=sample&&[5,9].includes(d);html+='<button class="day '+(sample&&d===10?'today ':'')+(d<10?'past':'')+'" data-day="'+d+'" aria-pressed="'+(selectedDay===d)+'" aria-label="'+d+' '+new Date(year,month).toLocaleDateString('ru',{month:'long'})+(train?', '+(d<10?'завершённая':'плановая')+' тренировка':'')+(photo?', фотографии':'')+'"><span class="num">'+d+'</span>'+(photo?'<span class="photo" aria-hidden="true">ФОТО</span>':'')+(train?'<span class="dot"></span>':'')+'</button>';}return html+'</div><div class="legend"><span><i class="dot"></i>По плану</span><span><i class="dot" style="background:var(--muted)"></i>Выполнено</span><span>ФОТО · заполнитель</span></div>';}
function today(){return '<header><p class="eyebrow">Суббота, 10 октября</p><h1>В своём темпе.</h1></header><div class="surface"><p class="small muted">'+(done?'Тренировка завершена':'Демонстрационная тренировка')+'</p><div class="lead">Верх тела</div><div class="meta"><span>3 упражнения</span><span>10 подходов</span></div><button class="primary" id="start">'+(done?'Посмотреть результат':active?'Продолжить тренировку':'Начать тренировку')+'</button></div><section class="section">'+calendar()+'</section><div class="next"><p class="small muted">Следующая по программе · понедельник, 12 октября</p><h3 style="margin-top:5px">Ноги и спина</h3></div>';}
function workout(){if(done)return '<button class="back" id="back">‹ Сегодня</button><header><p class="eyebrow">Хорошая работа</p><h1>Тренировка завершена.</h1></header><div class="summary"><div><strong>'+completed.reduce((a,b)=>a+b,0)+'</strong><span class="muted small">подходов</span></div><div><strong>'+restLog.length+'</strong><span class="muted small">интервалов отдыха</span></div></div><p class="muted">Суммарный отдых: '+format(restLog.reduce((a,b)=>a+b,0))+'</p><label class="field">Как прошла тренировка?<textarea placeholder="Самочувствие, что получилось…"></textarea></label><p class="small muted">Сводка демонстрирует действия в этом эскизе.</p>';return '<button class="back" id="back">‹ Сегодня</button><header><p class="eyebrow">Тренировка · верх тела</p><h1>Ещё один подход.</h1></header><p class="muted small">'+completed.reduce((a,b)=>a+b,0)+' из 10 подходов выполнено</p>'+names.map((n,i)=>'<div class="exercise"><div class="row"><button class="name" data-exercise="'+i+'">'+n+' <span class="muted">›</span></button><span class="small muted">'+weights[i]+' кг</span></div><p class="small muted">'+targets[i]+' подхода · 8 повторений</p><div class="sets">'+Array.from({length:targets[i]},(_,j)=>'<button class="set" data-set="'+i+','+j+'" '+(restStart!==null||j!==completed[i]?'disabled':'')+' aria-pressed="'+(j<completed[i])+'" aria-label="'+n+', завершить подход '+(j+1)+'">'+(j<completed[i]?'✓':j+1)+'</button>').join('')+'</div></div>').join('')+(restStart!==null?'<div class="rest"><div class="row"><div><p class="small muted">Отдых после подхода</p><div id="timer" class="timer">'+format((Date.now()-restStart)/1000)+'</div></div><span class="small muted">В своём темпе</span></div><button class="primary" id="resume">Приступить к подходу</button></div>':'<p class="section small muted">Отметьте завершённый подход — начнётся отсчёт отдыха.</p>')+'<button class="secondary" id="finish">Завершить тренировку</button>';}
function program(){return '<header><p class="eyebrow">Ваш недельный ритм</p><h1>Программа.</h1></header><h2>Осенний цикл</h2><p class="muted small">6 недель · 3 тренировки в неделю</p><div class="dates"><label class="field">Начало<input type="date" value="2026-10-05"></label><label class="field">Окончание<input type="date" value="2026-11-15"></label></div><p class="small muted">Тренировочные дни</p><div class="daypick">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((n,i)=>'<button data-weekday="'+(i+1)+'" aria-pressed="'+weekdays.has(i+1)+'">'+n+'</button>').join('')+'</div><section class="section"><div class="row"><h2>Понедельник</h2><button class="secondary" id="copy">Копировать</button></div>'+names.map((n,i)=>'<div class="exercise"><h3>'+n+'</h3><p class="small muted">'+weights[i]+' кг · '+targets[i]+' × 8</p></div>').join('')+'<button class="secondary" id="add">＋ Добавить упражнение</button></section><p id="program-message" class="toast" role="status"></p>';}
function progress(){return '<header><p class="eyebrow">Маленькие шаги. Видимый результат.</p><h1>Прогресс.</h1></header><h2>Жим лёжа</h2><p class="small muted">Демонстрационный пример</p><div class="segment"><button class="active" data-range="6">6 недель</button><button data-range="12">12 недель</button></div><div class="metric"><p class="small muted">Максимальный рабочий вес</p><div class="big">80 <span class="muted" style="font-size:24px">кг</span></div><p class="small" style="color:var(--accent);margin-top:8px" id="delta">+10 кг за 6 недель</p></div><svg class="chart" viewBox="0 0 360 220" role="img" aria-label="Демонстрационный график: максимальный рабочий вес за тренировку вырос с 70 до 80 кг"><path class="gridline" d="M30 35H350M30 95H350M30 155H350"/><text x="0" y="39">80</text><text x="0" y="99">75</text><text x="0" y="159">70</text><path class="trend" id="trend" d="M35 155L95 155L155 125L215 95L275 65L335 35"/><circle cx="335" cy="35" r="5"/><text x="30" y="198">1 сен</text><text x="155" y="198">21 сен</text><text x="295" y="198">9 окт</text></svg><div class="next"><h3>Стабильно растёте</h3><p class="small muted" style="margin-top:7px">Вес — максимум среди выполненных подходов за тренировку. Плановые значения не включены.</p></div>';}
function day(){const sample=year===2026&&month===9,photo=sample&&[5,9].includes(selectedDay),train=sample&&[2,5,7,9,12,14,16,19,21,23,26,28,30].includes(selectedDay);screen.innerHTML='<button class="back" id="back-day">‹ '+(tab==='today'?'Сегодня':'Календарь')+'</button><header><p class="eyebrow">'+new Date(year,month,selectedDay).toLocaleDateString('ru',{weekday:'long'})+'</p><h1>'+new Date(year,month,selectedDay).toLocaleDateString('ru',{day:'numeric',month:'long'})+'</h1></header>'+(train?'<div class="surface"><p class="small muted">'+(selectedDay<10?'Выполнено':'По плану')+'</p><div class="lead">Верх тела</div><p class="muted small">3 упражнения · 10 подходов</p></div>':'<p class="muted">Тренировка не запланирована.</p>')+(photo?'<div class="gallery"><div class="tile">Фото · заполнитель 1</div><div class="tile">Фото · заполнитель 2</div></div>':'')+'<label class="field section">Заметка дня<textarea placeholder="Несколько слов об этом дне…"></textarea></label><p class="small muted">В эскизе заметка не сохраняется. Галерея и добавление фотографий — в следующей итерации.</p>';}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));screen.innerHTML=tab==='today'?today():tab==='calendar'?'<header><p class="eyebrow">Ваш тренировочный дневник</p><h1>Календарь.</h1></header>'+calendar()+'<p class="section small muted">Откройте день, чтобы посмотреть тренировку, фотографии и заметку.</p>':tab==='program'?program():progress();window.scrollTo(0,0);}
function format(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function stopRest(){if(restStart!==null){restLog.push((Date.now()-restStart)/1000);restStart=null;}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='theme'){const dark=document.documentElement.classList.toggle('dark');b.textContent=dark?'☀':'☾';b.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');return;}if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.month){month+=Number(b.dataset.month);if(month<0){month=11;year--;}if(month>11){month=0;year++;}selectedDay=null;render();return;}if(b.dataset.day){selectedDay=Number(b.dataset.day);day();return;}if(b.id==='back-day'||b.id==='back'){render();return;}if(b.id==='start'){active=true;screen.innerHTML=workout();return;}if(b.dataset.set){const [i,j]=b.dataset.set.split(',').map(Number);if(j===completed[i]&&restStart===null){completed[i]++;restStart=Date.now();screen.innerHTML=workout();}return;}if(b.id==='resume'){stopRest();screen.innerHTML=workout();return;}if(b.id==='finish'){stopRest();done=true;active=false;screen.innerHTML=workout();return;}if(b.dataset.exercise){const i=Number(b.dataset.exercise);screen.innerHTML='<button class="back" id="back-workout">‹ Тренировка</button><header><p class="eyebrow">Упражнение '+(i+1)+' из 3</p><h1>'+names[i]+'</h1></header><div class="summary"><div><strong>'+weights[i]+' кг</strong><span class="small muted">плановый вес</span></div><div><strong>'+targets[i]+' × 8</strong><span class="small muted">подходы × повторы</span></div></div><label class="field">Заметка к упражнению<textarea placeholder="Настройки, ощущения, что учесть…"></textarea></label><div class="section"><h2>Техника выполнения</h2><p class="small muted" style="margin-top:10px">Место для советов с проверенным источником. Текст будет подготовлен отдельно.</p></div>';return;}if(b.id==='back-workout'){screen.innerHTML=workout();return;}if(b.dataset.weekday){const d=Number(b.dataset.weekday);weekdays.has(d)?weekdays.delete(d):weekdays.add(d);render();return;}if(b.id==='copy'||b.id==='add'){document.getElementById('program-message').textContent=b.id==='copy'?'Здесь откроется выбор дней для копирования.':'Здесь откроется личная библиотека упражнений.';return;}if(b.dataset.range){document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('delta').textContent=b.dataset.range==='6'?'+10 кг за 6 недель':'+10 кг за 12 недель';document.getElementById('trend').setAttribute('d',b.dataset.range==='6'?'M35 155L95 155L155 125L215 95L275 65L335 35':'M35 155L95 155L155 125L215 95L275 65L335 35');}});
setInterval(()=>{const t=document.getElementById('timer');if(t&&restStart!==null)t.textContent=format((Date.now()-restStart)/1000);},500);
render();
</script>
</body></html>
