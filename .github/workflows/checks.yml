name: Проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run check
      - name: Совместимость API с предыдущим коммитом
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CONTRACT_BASE" ] && [ "$CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]; then
            npm run api:compatibility -- "$CONTRACT_BASE"
          else
            echo "Первый push: предыдущий контракт отсутствует"
          fi
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - name: Форматирование Go
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/api ./cmd/api
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
