name: Проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run check
      - name: Совместимость API с предыдущим коммитом
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CONTRACT_BASE" ] && [ "$CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]; then
            npm run api:compatibility -- "$CONTRACT_BASE"
          else
            echo "Первый push: предыдущий контракт отсутствует"
          fi
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - name: Форматирование Go
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/api ./cmd/api
  containers:
    runs-on: ubuntu-latest
    env:
      PODHOD_SECRETS_DIR: /tmp/podhod-ci-secrets
      PODHOD_MEDIA_DIR: /tmp/podhod-ci-media
      COMPOSE_PROJECT_NAME: podhod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tooling/dev/secrets.mjs
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Проверка production Compose и конфигураций proxy/web
        env:
          PODHOD_DOMAIN: checks.example.invalid
          PODHOD_STATE_DIR: /tmp/podhod-ci-state
          PODHOD_API_IMAGE: podhod-api
          PODHOD_WEB_IMAGE: podhod-web
          PODHOD_PROXY_IMAGE: caddy:2.11.7-alpine
          PODHOD_DB_IMAGE: postgres:18.6-alpine
        run: |
          docker compose -f compose.production.yaml config --quiet
          docker run --rm --user 65532:65532 --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 -e PODHOD_DOMAIN="$PODHOD_DOMAIN" -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" "$PODHOD_PROXY_IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 -v "$PWD/infra/nginx.production.conf:/etc/nginx/podhod.conf:ro" --entrypoint nginx podhod-web -t -c /etc/nginx/podhod.conf
