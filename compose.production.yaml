name: podhod

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: '2'

services:
  proxy:
    <<: *runtime
    image: ${PODHOD_PROXY_IMAGE:?Set a Caddy image digest}
    user: '65532:65532'
    environment:
      PODHOD_DOMAIN: ${PODHOD_DOMAIN:?Set the public domain}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports: ['80:8080', '443:8443']
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PODHOD_STATE_DIR:?Set an absolute state directory}/caddy-data:/data
      - ${PODHOD_STATE_DIR}/caddy-config:/config
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks: [edge, upstream]
    mem_limit: 128m
    depends_on: [web, api]

  web:
    <<: *runtime
    image: ${PODHOD_WEB_IMAGE:?Set a web image digest}
    entrypoint: [nginx]
    command: ['-c', /etc/nginx/podhod.conf, '-g', 'daemon off;']
    volumes:
      - ./infra/nginx.production.conf:/etc/nginx/podhod.conf:ro
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks: [upstream]
    mem_limit: 64m

  db:
    restart: unless-stopped
    image: ${PODHOD_DB_IMAGE:?Set a PostgreSQL 18.6 image digest}
    environment:
      POSTGRES_DB: podhod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      [
        db_admin_password,
        db_api_password,
        db_worker_password,
        db_migration_password,
      ]
    volumes:
      - ${PODHOD_STATE_DIR}/postgres:/var/lib/postgresql
      - ./apps/api/db/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    command:
      [
        postgres,
        '-c',
        shared_buffers=64MB,
        '-c',
        max_connections=32,
        '-c',
        work_mem=2MB,
        '-c',
        maintenance_work_mem=32MB,
        '-c',
        max_parallel_workers=0,
      ]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d podhod']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    mem_limit: 384m
    shm_size: 64m
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: '2' }

  migrate:
    image: ${PODHOD_API_IMAGE:?Set an API image digest}
    entrypoint: [/migrate]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url]
    networks: [database]
    mem_limit: 128m
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *runtime
    image: ${PODHOD_API_IMAGE}
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      PUBLIC_ORIGIN: https://${PODHOD_DOMAIN}
      TRUSTED_PROXY_CIDRS: ${PODHOD_UPSTREAM_SUBNET:-172.30.80.0/28}
      DATABASE_URL_FILE: /run/secrets/api_database_url
      AUTH_HMAC_KEY_FILE: /run/secrets/auth_hmac_key
      JOB_ENCRYPTION_KEY_FILE: /run/secrets/job_encryption_key
      MEDIA_DIR: /var/lib/podhod/media
      GOMEMLIMIT: 160MiB
    secrets: [api_database_url, auth_hmac_key, job_encryption_key]
    volumes:
      - ${PODHOD_STATE_DIR}/media:/var/lib/podhod/media
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks: [upstream, database, outbound]
    mem_limit: 256m
    stop_grace_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *runtime
    image: ${PODHOD_API_IMAGE}
    entrypoint: [/worker]
    environment:
      DATABASE_URL_FILE: /run/secrets/worker_database_url
      JOB_ENCRYPTION_KEY_FILE: /run/secrets/job_encryption_key
      MEDIA_DIR: /var/lib/podhod/media
      GOMEMLIMIT: 256MiB
    secrets: [worker_database_url, job_encryption_key]
    volumes:
      - ${PODHOD_STATE_DIR}/media:/var/lib/podhod/media
    tmpfs: ['/tmp:size=32m,mode=1777']
    networks: [database, outbound]
    mem_limit: 384m
    stop_grace_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }

networks:
  edge: {}
  outbound: {}
  upstream:
    internal: true
    ipam:
      config:
        - subnet: ${PODHOD_UPSTREAM_SUBNET:-172.30.80.0/28}
  database:
    internal: true

secrets:
  db_admin_password:
    file: ${PODHOD_SECRETS_DIR:?Set an absolute secrets directory}/db_admin_password
  db_api_password:
    file: ${PODHOD_SECRETS_DIR}/db_api_password
  db_worker_password:
    file: ${PODHOD_SECRETS_DIR}/db_worker_password
  db_migration_password:
    file: ${PODHOD_SECRETS_DIR}/db_migration_password
  api_database_url:
    file: ${PODHOD_SECRETS_DIR}/api_database_url
  worker_database_url:
    file: ${PODHOD_SECRETS_DIR}/worker_database_url
  migration_database_url:
    file: ${PODHOD_SECRETS_DIR}/migration_database_url
  auth_hmac_key:
    file: ${PODHOD_SECRETS_DIR}/auth_hmac_key
  job_encryption_key:
    file: ${PODHOD_SECRETS_DIR}/job_encryption_key
