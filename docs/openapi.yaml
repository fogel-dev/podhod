  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: ID команды; одинаковый ID+payload возвращает первоначальный результат.
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: ID устройства из текущей сессии, не средство авторизации.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: Version в кавычках; "0" только для новой заметки/правила.
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        maxLength: 256
      description: Токен текущей сессии. Также обязательна проверка Origin.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 4096
        minLength: 1
  responses:
    Error400:
      description: Некорректный JSON/структура
      content:
        application/json:
          schema: &a3
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: Нужен вход
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: CSRF или действие запрещено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error404:
      description: Запись не найдена или чужая
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: Конфликт версии/ID/доменных правил
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error410:
      description: Срок snapshot/cursor истёк
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error413:
      description: Превышен размер
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error422:
      description: Недопустимые значения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error428:
      description: Требуется версия
      content:
        application/json:
          schema: *a3
    Error429:
      description: Лимит запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: Секунды до повтора
    Error500:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error503:
      description: Сервис временно недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error415:
      description: Неподдерживаемый тип содержимого
      content:
        application/json:
          schema: *a3
